<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>קרנבל במרכזית</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
      direction: rtl;
    }

    /* מסך התחברות */
    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    select, button {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      width: 220px;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    /* מפה */
    #map {
      height: 100vh;
      width: 100vw;
      display: none;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <h1>🎉 קרנבל במרכזית</h1>
  <p>בחר את השם שלך</p>

  <select id="nameSelect">
    <option>אלה</option>
    <option>גלי</option>
    <option>גפן</option>
    <option>דן</option>
    <option>זיו</option>
    <option>יעל בן לוי</option>
    <option>יעל שגב</option>
    <option>לוי</option>
    <option>ליבי</option>
    <option>מאיה</option>
    <option>נטע</option>
    <option>נוגה</option>
    <option>עומר</option>
    <option>עלמנש</option>
    <option>פנטנש</option>
    <option>צ'יקו</option>
    <option>רון</option>
    <option>רועי</option>
    <option>שחר</option>
    <option>שקד</option>
    <option>שיר</option>
    <option>שירה</option>
    <option>טפירו</option>
  </select>

  <button onclick="start()">כניסה</button>
</div>

<!-- 🗺 MAP -->
<div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import L from "https://unpkg.com/leaflet/dist/leaflet-src.esm.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyC3ogweHbWqunD1Gb9z9-D708e06eTCCdQ",
  authDomain: "carnivalmeet.firebaseapp.com",
  projectId: "carnivalmeet",
  storageBucket: "carnivalmeet.firebasestorage.app",
  messagingSenderId: "503896953376",
  appId: "1:503896953376:web:891ac2d42e9ab8c861e245"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let userId = null;
let userName = null;

let map;
let markers = {};

/* 🔐 anonymous auth (רקע בלבד) */
signInAnonymously(auth).then(u => {
  userId = u.user.uid;
});

/* 🟩 פוליגון תחנה */
const polygon = [
  [31.2413911, 34.7992480],
  [31.2433259, 34.7985828],
  [31.2438791, 34.7980219],
  [31.2439708, 34.7965950],
  [31.2443863, 34.7953412],
  [31.2439187, 34.7942147],
  [31.2435353, 34.7941736],
  [31.2428338, 34.7950300],
  [31.2420788, 34.7961120],
  [31.2413082, 34.7970057],
  [31.2405990, 34.7977098],
  [31.2413509, 34.7992548],
  [31.2442055, 34.8001707],
  [31.2452050, 34.8000526]
];

/* 📍 בדיקה אם בתוך אזור */
function inside(lat, lng, poly) {
  let inside = false;

  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

/* 🚀 התחלה */
window.start = function () {

  userName = document.getElementById("nameSelect").value;

  document.getElementById("login").style.display = "none";
  document.getElementById("map").style.display = "block";

  initMap();
};

/* 🗺 מפה */
function initMap() {

  map = L.map('map').setView([31.2428, 34.7975], 17);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  L.polygon(polygon, { color: "#3b82f6" }).addTo(map);

  watchLocation();
  listenUsers();
}

/* 📡 GPS חי */
function watchLocation() {

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const inZone = inside(lat, lng, polygon);

    await setDoc(doc(db, "users", userName), {
      name: userName,
      lat,
      lng,
      inZone,
      time: Date.now()
    });

  });
}

/* 👀 משתמשים אחרים */
function listenUsers() {

  onSnapshot(collection(db, "users"), (snap) => {

    snap.forEach(d => {
      const u = d.data();
      if (!u.lat) return;

      if (!markers[d.id]) {
        markers[d.id] = L.circleMarker([u.lat, u.lng], {
          radius: 8,
          color: u.inZone ? "#22c55e" : "#ef4444"
        }).addTo(map);
      } else {
        markers[d.id].setLatLng([u.lat, u.lng]);
      }

      markers[d.id].bindPopup(u.name);
    });

  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>תחנה חיה</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
      direction: rtl;
    }

    /* התחברות */
    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      background: #4285F4;
      color: white;
    }

    /* מפה */
    #map {
      height: 100vh;
      width: 100vw;
      display: none;
    }
  </style>
</head>

<body>

<!-- 🔐 מסך התחברות -->
<div id="login">
  <h1>🚉 תחנה חיה</h1>
  <p>התחבר כדי להמשיך</p>
  <button id="loginBtn">התחברות עם Google</button>
</div>

<!-- 🗺 מפה -->
<div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import L from "https://unpkg.com/leaflet/dist/leaflet-src.esm.js";

/* 🔥 Firebase שלך */
const firebaseConfig = {
  apiKey: "AIzaSyC3ogweHbWqunD1Gb9z9-D708e06eTCCdQ",
  authDomain: "carnivalmeet.firebaseapp.com",
  projectId: "carnivalmeet",
  storageBucket: "carnivalmeet.firebasestorage.app",
  messagingSenderId: "503896953376",
  appId: "1:503896953376:web:891ac2d42e9ab8c861e245"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user = null;
let map;
let markers = {};

/* 🟢 Google login */
document.getElementById("loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

/* 👤 זיהוי התחברות */
onAuthStateChanged(auth, (u) => {
  if (!u) return;

  user = u;

  document.getElementById("login").style.display = "none";
  document.getElementById("map").style.display = "block";

  startApp();
});

/* 🟩 פוליגון */
const polygon = [
  [31.2413911, 34.7992480],
  [31.2433259, 34.7985828],
  [31.2438791, 34.7980219],
  [31.2439708, 34.7965950],
  [31.2443863, 34.7953412],
  [31.2439187, 34.7942147],
  [31.2435353, 34.7941736],
  [31.2428338, 34.7950300],
  [31.2420788, 34.7961120],
  [31.2413082, 34.7970057],
  [31.2405990, 34.7977098],
  [31.2413509, 34.7992548],
  [31.2442055, 34.8001707],
  [31.2452050, 34.8000526]
];

/* 📍 בדיקה בתוך אזור */
function inside(lat, lng, poly) {
  let inside = false;

  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

/* 🚀 הפעלת האפליקציה */
function startApp() {

  map = L.map('map').setView([31.2428, 34.7975], 17);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  L.polygon(polygon, { color: "#3b82f6" }).addTo(map);

  watchLocation();
  listenUsers();
}

/* 📡 GPS חי */
function watchLocation() {
  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const inZone = inside(lat, lng, polygon);

    await setDoc(doc(db, "users", user.uid), {
      name: user.displayName,
      lat,
      lng,
      inZone,
      time: Date.now()
    });

  });
}

/* 👀 משתמשים */
function listenUsers() {

  onSnapshot(collection(db, "users"), (snap) => {

    snap.forEach(d => {
      const u = d.data();
      if (!u.lat) return;

      if (!markers[d.id]) {
        markers[d.id] = L.circleMarker([u.lat, u.lng], {
          radius: 8,
          color: u.inZone ? "#22c55e" : "#ef4444"
        }).addTo(map);
      } else {
        markers[d.id].setLatLng([u.lat, u.lng]);
      }

      markers[d.id].bindPopup(u.name || "משתמש");
    });

  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>קרנבל במרכזית</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
      direction: rtl;
    }

    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    select, button {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      width: 220px;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    #map {
      height: 100vh;
      width: 100vw;
      display: none;
    }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <h1>🎉 קרנבל במרכזית</h1>
  <p>בחר שם</p>

  <select id="nameSelect">
    <option>אלה</option>
    <option>גלי</option>
    <option>גפן</option>
    <option>דן</option>
    <option>זיו</option>
    <option>יעל בן לוי</option>
    <option>יעל שגב</option>
    <option>לוי</option>
    <option>ליבי</option>
    <option>מאיה</option>
    <option>נטע</option>
    <option>נוגה</option>
    <option>עומר</option>
    <option>עלמנש</option>
    <option>פנטנש</option>
    <option>צ'יקו</option>
    <option>רון</option>
    <option>רועי</option>
    <option>שחר</option>
    <option>שקד</option>
    <option>שיר</option>
    <option>שירה</option>
    <option>טפירו</option>
  </select>

  <button onclick="start()">כניסה</button>
</div>

<!-- 🗺 MAP -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3ogweHbWqunD1Gb9z9-D708e06eTCCdQ",
  authDomain: "carnivalmeet.firebaseapp.com",
  projectId: "carnivalmeet",
  storageBucket: "carnivalmeet.firebasestorage.app",
  messagingSenderId: "503896953376",
  appId: "1:503896953376:web:891ac2d42e9ab8c861e245"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let map;
let markers = {};
let userName = null;

/* 🟩 פוליגון תחנה (שלך) */
const polygon = [
  [31.24101633447053, 34.79980304467395],
  [31.24333694479165, 34.79889870073973],
  [31.243983557476653, 34.79856663565582],
  [31.244019817609242, 34.79646120896297],
  [31.244690606246635, 34.79515415406266],
  [31.24384456893526, 34.793599807706016],
  [31.242472765272595, 34.79500578465044],
  [31.241143241942765, 34.79677208236822],
  [31.24053998744013, 34.797203055695405],
  [31.24046142487333, 34.798849246852285],
  [31.24101633447053, 34.79980304467395]
];

/* 📍 בדיקה */
function inside(lat, lng, poly) {
  let inside = false;

  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

/* 🔔 התראה */
function notify(msg) {
  if (Notification.permission === "granted") {
    new Notification(msg);
  }
}

/* 🚀 התחלה */
window.start = function () {

  userName = document.getElementById("nameSelect").value;

  document.getElementById("login").style.display = "none";
  document.getElementById("map").style.display = "block";

  if (Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  initMap();
};

/* 🗺 מפה */
function initMap() {

  map = L.map('map').setView([31.2428, 34.7975], 17);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  L.polygon(polygon, { color: "#3b82f6" }).addTo(map);

  watch();
  listen();
}

/* 📡 GPS */
function watch() {

  navigator.geolocation.watchPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    const inZone = inside(lat, lng, polygon);

    await setDoc(doc(db, "users", userName), {
      name: userName,
      lat,
      lng,
      inZone,
      time: Date.now()
    });

  });
}

/* 👀 משתמשים + התראה */
function listen() {

  let lastInside = {};

  onSnapshot(collection(db, "users"), (snap) => {

    snap.forEach(d => {
      const u = d.data();
      if (!u.lat) return;

      const wasInside = lastInside[d.id];
      const isInsideNow = u.inZone;

      /* 🔔 התראה על כניסה */
      if (!wasInside && isInsideNow && d.id !== userName) {
        notify(`${u.name} נכנס למרכזית 🎉`);
      }

      lastInside[d.id] = isInsideNow;

      if (!markers[d.id]) {
        markers[d.id] = L.circleMarker([u.lat, u.lng], {
          radius: 8,
          color: u.inZone ? "#22c55e" : "#ef4444"
        }).addTo(map);
      } else {
        markers[d.id].setLatLng([u.lat, u.lng]);
      }

      markers[d.id].bindPopup(u.name);
    });

  });
}
</script>

</body>
</html>
